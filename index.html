const API_URL="https://script.google.com/macros/s/AKfycbx9YCQpXfrKYcm5dHZQlmbv-yXHnK7CT9YtGl8ZtowdHstBZUH9QJNzk9u2fOc1MTSW/exec";let qs=[],attemptId="",deadline=0,timer;
const $=x=>document.getElementById(x);
function jsonp(action,extra={}){return new Promise((resolve,reject)=>{const cb="cb_"+Date.now()+"_"+Math.random().toString(36).slice(2),s=document.createElement("script");window[cb]=d=>{delete window[cb];s.remove();resolve(d)};s.onerror=()=>{delete window[cb];s.remove();reject(Error("Không kết nối được máy chủ"))};s.src=API_URL+"?"+new URLSearchParams({action,...extra,callback:cb});document.body.appendChild(s)})}
async function load(){try{const r=await jsonp("topics");$("topic").innerHTML=(r.topics||[]).map(t=>`<option value="${t.id}">${t.name}</option>`).join("")}catch(e){$("topic").innerHTML="<option>Lỗi tải chủ đề</option>"}}
function msg(t,ok=false){$("msg").className=ok?"ok":"err";$("msg").textContent=t;$("msg").classList.remove("hidden")}
function formatName(s){return String(s||"").trim().toLocaleLowerCase("vi-VN").replace(/(^|[\s-])(\p{L})/gu,(m,sep,ch)=>sep+ch.toLocaleUpperCase("vi-VN"));}
async function start(){const code=$("code").value.trim().toUpperCase().replace(/\s+/g,""),name=formatName($("name").value),tid=$("topic").value;$("code").value=code;$("name").value=name;if(!/^VN[0-9]{6}$/.test(code))return msg("Mã nhân viên phải có dạng VN + 6 chữ số.");if(!name)return msg("Vui lòng nhập họ và tên.");try{const r=await jsonp("start",{employee_code:code,employee_name:name,topic_id:tid});if(!r.ok)return msg(r.error);attemptId=r.attempt_id;qs=r.questions||[];$("topicName").textContent=r.topic_name;$("cand").textContent=code+" • "+name;$("form").innerHTML=qs.map((q,i)=>q.type==="ESSAY"?`<div class="q"><b>Câu ${i+1}. ${q.text}</b><textarea name="q_${q.id}" placeholder="Nhập câu trả lời..."></textarea></div>`:`<div class="q"><b>Câu ${i+1}. ${q.text}</b>${(q.options||[]).map((o,j)=>`<label class="opt"><input type="radio" name="q_${q.id}" value="${String.fromCharCode(65+j)}"> ${String.fromCharCode(65+j)}. ${o}</label>`).join("")}</div>`).join("");$("login").classList.add("hidden");$("exam").classList.remove("hidden");deadline=Date.now()+45*60000;tick()}catch(e){msg(e.message)}}
function tick(){clearTimeout(timer);const s=Math.max(0,Math.ceil((deadline-Date.now())/1000));$("clock").textContent=String(Math.floor(s/60)).padStart(2,"0")+":"+String(s%60).padStart(2,"0");if(s<=0)return submitExam(true);timer=setTimeout(tick,500)}
function submitExam(auto){if(!auto&&!confirm("Bạn chắc chắn muốn nộp bài?"))return;const ans={};qs.forEach(q=>{if(q.type==="ESSAY")ans[q.id]=document.querySelector(`[name="q_${q.id}"]`)?.value||"";else{const e=document.querySelector(`input[name="q_${q.id}"]:checked`);ans[q.id]=e?e.value:null}});const f=document.createElement("iframe");f.name="submit_"+Date.now();f.style.display="none";document.body.appendChild(f);const form=document.createElement("form");form.method="POST";form.action=API_URL;form.target=f.name;form.style.display="none";const add=(n,v)=>{const x=document.createElement("input");x.name=n;x.value=v;form.appendChild(x)};add("action","submit");add("attempt_id",attemptId);add("answers",JSON.stringify(ans));document.body.appendChild(form);form.submit();setTimeout(()=>pollResult(form,f),1200)}
async function pollResult(form,frame){try{const r=await jsonp("status",{attempt_id:attemptId});if(r.status==="SUBMITTED"){clearTimeout(timer);$("exam").classList.add("hidden");$("result").classList.remove("hidden");$("resultBox").innerHTML=`<div class="ok"><b>${String(r.passed)==="TRUE"?"ĐẠT":"KHÔNG ĐẠT"}</b><br>Điểm: <b>${r.score}/100</b></div>`;form.remove();frame.remove();return}}catch(e){}setTimeout(()=>pollResult(form,frame),1200)}
load();
</script></body></html>
